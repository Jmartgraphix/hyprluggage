# Octarine Theme
# The color of magic from Discworld
# https://github.com/Jmartgraphix/hyprluggage

# : Manager [[[

[mgr]
cwd = { fg = "#E8F0E0" }

# Find
find_keyword = { fg = "#FFFFFF", bold = true, italic = true, underline = true }
find_position = { fg = "#FFFFFF", bold = true, italic = true }

# Marker
marker_copied = { fg = "#54FFD4", bg = "#54FFD4" }
marker_cut = { fg = "#FF8A95", bg = "#FF8A95" }
marker_marked = { fg = "#A8FF54", bg = "#A8FF54" }
marker_selected = { fg = "#D17FF7", bg = "#D17FF7" }

# Count
count_copied = { fg = "#0A0710", bg = "#54FFD4" }
count_cut = { fg = "#0A0710", bg = "#FF8A95" }
count_selected = { fg = "#0A0710", bg = "#D17FF7" }

# Border
border_symbol = " "
border_style  = { fg = "#3A3550" }

# : ]]]


# : Status [[[

[status]
sep_left = { open = "", close = "🭠" }
sep_right = { open = "🭁", close = "" }

# Permissions
perm_type = { fg = "#E59FFF" }
perm_read = { fg = "#A8FF54" }
perm_write = { fg = "#D17FF7" }
perm_exec = { fg = "#FF8A95" }
perm_sep = { fg = "#54FFD4" }

# Progress
progress_label = { bold = true }
progress_normal = { fg = "#A8FF54", bg = "#0f0a16" }
progress_error = { fg = "#FF8A95", bg = "#0f0a16" }

[mode]
# Mode
normal_main = { bg = "#A8FF54", fg = "#0A0710", bold = true }
normal_alt  = { bg = "#1A1320", fg = "#E8F0E0" }

# Select mode
select_main = { bg = "#7AFFE5", fg = "#0A0710", bold = true }
select_alt  = { bg = "#1A1320", fg = "#E8F0E0" }

# Unset mode
unset_main = { bg = "#D17FF7", fg = "#0A0710", bold = true }
unset_alt  = { bg = "#1A1320", fg = "#E8F0E0" }

# : ]]]


# : Select [[[

[select]
border = { fg = "#3A3550" }
active = { fg = "#A8FF54", bold = true }

# : ]]]


# : Input [[[

[input]
border = { fg = "#3A3550" }
value = { fg = "#E8F0E0" }

# : ]]]

# : Tabs [[[

[tabs]
active = { fg = "#A8FF54", bold = true, bg = "#0A0710" }
inactive = { fg = "#3A3550", bg = "#0A0710" }
sep_inner = { open = "[", close = "]" }

# : ]]]


# : Completion [[[

[cmp]
border = { fg = "#3A3550", bg = "#1A1320" }

# : ]]]


# : Tasks [[[

[tasks]
border = { fg = "#3A3550" }
title = {}
hovered = { fg = "#7AFFE5", underline = true }

# : ]]]


# : Which [[[

[which]
cols = 3
mask = { bg = "#0f0a16" }
cand = { fg = "#A8FF54" }
rest = { fg = "#3A3550" }
desc = { fg = "#E8F0E0" }
separator = " ▶ "
separator_style = { fg = "#D17FF7" }

# : ]]]


# : Help [[[

[help]
on = { fg = "#E8F0E0" }
run = { fg = "#E8F0E0" }
footer = { fg = "#0A0710", bg = "#A8FF54" }

# : ]]]


# : Notify [[[

[notify]
title_info = { fg = "#54FFD4" }
title_warn = { fg = "#FFF454" }
title_error = { fg = "#FF8A95" }

# : ]]]


# : File-specific styles [[[

[filetype]

rules = [
    # Images
    { mime = "image/*", fg = "#54FFD4" },

    # Media
    { mime = "{audio,video}/*", fg = "#FFF454" },

    # Archives
    { mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "#E59FFF" },

    # Documents
    { mime = "application/{pdf,doc,rtf}", fg = "#95B5FF" },

    # Special files
    { url = "*", is = "orphan", bg = "#FF6B7A" },
    { url = "*", is = "exec", fg = "#FFFFFF" },

    # Fallback
    { url = "*", fg = "#E8F0E0" },
    { url = "*/", fg = "#A8FF54" },
]

# : ]]]

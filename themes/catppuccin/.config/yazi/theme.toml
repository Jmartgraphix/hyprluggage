# Catppuccin Mocha Theme
# https://github.com/catppuccin/catppuccin

# : Manager [[[

[mgr]
cwd = { fg = "#cdd6f4" }

# Find
find_keyword = { fg = "#f9e2af", bold = true, italic = true, underline = true }
find_position = { fg = "#f9e2af", bold = true, italic = true }

# Marker
marker_copied = { fg = "#a6e3a1", bg = "#a6e3a1" }
marker_cut = { fg = "#f38ba8", bg = "#f38ba8" }
marker_marked = { fg = "#f9e2af", bg = "#f9e2af" }
marker_selected = { fg = "#cba6f7", bg = "#cba6f7" }

# Count
count_copied = { fg = "#1e1e2e", bg = "#a6e3a1" }
count_cut = { fg = "#1e1e2e", bg = "#f38ba8" }
count_selected = { fg = "#1e1e2e", bg = "#cba6f7" }

# Border
border_symbol = " "
border_style  = { fg = "#cba6f7" }

# : ]]]


# : Status [[[

[status]
sep_left = { open = "", close = "🭠" }
sep_right = { open = "🭁", close = "" }

# Permissions
perm_type = { fg = "#cba6f7" }
perm_read = { fg = "#a6e3a1" }
perm_write = { fg = "#f9e2af" }
perm_exec = { fg = "#f38ba8" }
perm_sep = { fg = "#f5c2e7" }

# Progress
progress_label = { bold = true }
progress_normal = { fg = "#cba6f7", bg = "#313244" }
progress_error = { fg = "#f38ba8", bg = "#313244" }

[mode]
# Mode
normal_main = { bg = "#cba6f7", fg = "#1e1e2e", bold = true }
normal_alt  = { bg = "#313244", fg = "#cdd6f4" }

# Select mode
select_main = { bg = "#f5c2e7", fg = "#1e1e2e", bold = true }
select_alt  = { bg = "#313244", fg = "#cdd6f4" }

# Unset mode
unset_main = { bg = "#a6e3a1", fg = "#1e1e2e", bold = true }
unset_alt  = { bg = "#313244", fg = "#cdd6f4" }

# : ]]]


# : Select [[[

[select]
border = { fg = "#cba6f7" }
active = { fg = "#a6e3a1", bold = true }

# : ]]]


# : Input [[[

[input]
border = { fg = "#cba6f7" }
value = { fg = "#cdd6f4" }

# : ]]]

# : Tabs [[[

[tabs]
active = { fg = "#cba6f7", bold = true, bg = "#1e1e2e" }
inactive = { fg = "#bac2de", bg = "#1e1e2e" }
sep_inner = { open = "[", close = "]" }

# : ]]]


# : Completion [[[

[cmp]
border = { fg = "#cba6f7", bg = "#313244" }

# : ]]]


# : Tasks [[[

[tasks]
border = { fg = "#cba6f7" }
title = {}
hovered = { fg = "#f5c2e7", underline = true }

# : ]]]


# : Which [[[

[which]
cols = 3
mask = { bg = "#313244" }
cand = { fg = "#cba6f7" }
rest = { fg = "#bac2de" }
desc = { fg = "#cdd6f4" }
separator = " ▶ "
separator_style = { fg = "#cdd6f4" }

# : ]]]


# : Help [[[

[help]
on = { fg = "#cdd6f4" }
run = { fg = "#cdd6f4" }
footer = { fg = "#1e1e2e", bg = "#f5c2e7" }

# : ]]]


# : Notify [[[

[notify]
title_info = { fg = "#cba6f7" }
title_warn = { fg = "#f9e2af" }
title_error = { fg = "#f38ba8" }

# : ]]]


# : File-specific styles [[[

[filetype]

rules = [
    # Images
    { mime = "image/*", fg = "#cba6f7" },

    # Media
    { mime = "{audio,video}/*", fg = "#f9e2af" },

    # Archives
    { mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "#f5c2e7" },

    # Documents
    { mime = "application/{pdf,doc,rtf}", fg = "#a6e3a1" },

    # Special files
    { url = "*", is = "orphan", bg = "#f38ba8" },
    { url = "*", is = "exec", fg = "#cdd6f4" },

    # Fallback
    { url = "*", fg = "#cdd6f4" },
    { url = "*/", fg = "#cba6f7" },
]

# : ]]]

## Catppuccin Mocha Theme

# This file is not a full hyprland configuration.
# It is intended to be included in your main hyprland.conf.

# Active border color - using Catppuccin Mocha Mauve
$activeBorderColor = rgba(cba6f7aa)

general {
    col.active_border = $activeBorderColor
}

group {
    col.border_active = $activeBorderColor
}

# Border colors
$secondary = rgba(cba6f7aa)
$outline_variant = rgba(45475aaa)

# Shadow configuration
decoration {
    shadow {
        color = rgba(17, 17, 27, 0.4)
        color_inactive = rgba(17, 17, 27, 0.2)
        offset = 2 2
        range = 11
        render_power = 2
    }
}

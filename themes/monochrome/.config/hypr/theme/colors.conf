## Hyprluggage
## Author: Jmartgraphix
## Theme: Monochrome


# This file is not a full hyprland configuration.
# It is intended to be included in your main hyprland.conf.

$activeBorderColor = rgba(707070ff)

general {
    col.active_border = $activeBorderColor
}

group {
    col.border_active = $activeBorderColor
}

# Border colors
$secondary = rgba(707070ff)
$outline_variant = rgba(0f0f0fff)

# Shadow configuration
decoration {
    shadow {
        color = rgba(0f0f0f99)
        color_inactive = rgba(0f0f0f4d)
        offset = 2 2
        range = 11
        render_power = 2
    }
}

## Everforest Theme
## https://github.com/sainnhe/everforest

# This file is not a full hyprland configuration.
# It is intended to be included in your main hyprland.conf.

# Active border color - using Everforest green
$activeBorderColor = rgba(83c092aa)

general {
    col.active_border = $activeBorderColor
}

group {
    col.border_active = $activeBorderColor
}

# Border colors
$secondary = rgba(83c092aa)
$outline_variant = rgba(4a5560aa)

# Shadow configuration
decoration {
    shadow {
        color = rgba(2b333966)
        color_inactive = rgba(2b333933)
        offset = 2 2
        range = 11
        render_power = 2
    }
}

# : Manager [[[

[mgr]
cwd = { fg = "#dfe3e7" }

# Find
find_keyword = { fg = "#ffb4ab", bold = true, italic = true, underline = true }
find_position = { fg = "#ffb4ab", bold = true, italic = true }

# Marker
marker_copied = { fg = "#8e79ff", bg = "#8e79ff" }
marker_cut = { fg = "#e4dfff", bg = "#e4dfff" }
marker_marked = { fg = "#ffb4ab", bg = "#ffb4ab" }
marker_selected = { fg = "#c7c2ea", bg = "#c7c2ea" }

# Count
count_copied = { fg = "#1b1736", bg = "#e4dfff" }
count_cut = { fg = "#1b1736", bg = "#e4dfff" }
count_selected = { fg = "#003547", bg = "#c7c2ea" }

# Border
border_symbol = " "
border_style  = { fg = "#8ccff1" }

# : ]]]


# : Status [[[

[status]
sep_left = { open = "", close = "🭠" }
sep_right = { open = "🭁", close = "" }

# Permissions
perm_type = { fg = "#55839c" }
perm_read = { fg = "#6346ff" }
perm_write = { fg = "#5f50c3" }
perm_exec = { fg = "#ff2b12" }
perm_sep = { fg = "#26b1ff" }

# Progress
progress_label = { bold = true }
progress_normal = { fg = "#8ccff1", bg = "#353a3d" }
progress_error = { fg = "#ffb4ab", bg = "#353a3d" }

[mode]
# Mode
normal_main = { bg = "#8ccff1", fg = "#003547", bold = true }
normal_alt  = { bg = "#40484c", fg = "#c0c7cd" }

# Select mode
select_main = { bg = "#b4cad6", fg = "#1f333d", bold = true }
select_alt  = { bg = "#40484c", fg = "#c0c7cd" }

# Unset mode
unset_main = { bg = "#c7c2ea", fg = "#302d4c", bold = true }
unset_alt  = { bg = "#40484c", fg = "#c0c7cd" }

# : ]]]


# : Select [[[

[select]
border = { fg = "#8ccff1" }
active = { fg = "#c7c2ea", bold = true }

# : ]]]


# : Input [[[

[input]
border = { fg = "#8ccff1" }
value = { fg = "#dfe3e7" }

# : ]]]

# : Tabs [[[

[tabs]
active = { fg = "#8ccff1", bold = true, bg = "#0f1417" }
inactive = { fg = "#b4cad6", bg = "#0f1417" }
sep_inner = { open = "[", close = "]" }

# : ]]]


# : Completion [[[

[cmp]
border = { fg = "#8ccff1", bg = "#003547" }

# : ]]]


# : Tasks [[[

[tasks]
border = { fg = "#8ccff1" }
title = {}
hovered = { fg = "#e4dfff", underline = true }

# : ]]]


# : Which [[[

[which]
cols = 3
mask = { bg = "#353a3d" }
cand = { fg = "#8ccff1" }
rest = { fg = "#003547" }
desc = { fg = "#dfe3e7" }
separator = " ▶ "
separator_style = { fg = "#dfe3e7" }

# : ]]]


# : Help [[[

[help]
on = { fg = "#dfe3e7" }
run = { fg = "#dfe3e7" }
footer = { fg = "#1f333d", bg = "#b4cad6" }

# : ]]]


# : Notify [[[

[notify]
title_info = { fg = "#c7c2ea" }
title_warn = { fg = "#8ccff1" }
title_error = { fg = "#ffb4ab" }

# : ]]]


# : File-specific styles [[[

[filetype]

rules = [
    # Images
    { mime = "image/*", fg = "#94e2d5" },

    # Media
    { mime = "{audio,video}/*", fg = "#f9e2af" },

    # Archives
    { mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "#f5c2e7" },

    # Documents
    { mime = "application/{pdf,doc,rtf}", fg = "#a6e3a1" },

    # Special files
    { url = "*", is = "orphan", bg = "#93000a" },
    { url = "*", is = "exec", fg = "#ffdad6" },

    # Fallback
    { url = "*", fg = "#dfe3e7" },
    { url = "*/", fg = "#8ccff1" },
]

# : ]]]

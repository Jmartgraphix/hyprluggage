# : Manager [[[

[mgr]
cwd = { fg = "#f0dfd7" }

# Find
find_keyword = { fg = "#ffb4ab", bold = true, italic = true, underline = true }
find_position = { fg = "#ffb4ab", bold = true, italic = true }

# Marker
marker_copied = { fg = "#ccce5f", bg = "#ccce5f" }
marker_cut = { fg = "#e5e6ad", bg = "#e5e6ad" }
marker_marked = { fg = "#ffb4ab", bg = "#ffb4ab" }
marker_selected = { fg = "#c9ca94", bg = "#c9ca94" }

# Count
count_copied = { fg = "#1c1d00", bg = "#e5e6ad" }
count_cut = { fg = "#1c1d00", bg = "#e5e6ad" }
count_selected = { fg = "#502400", bg = "#c9ca94" }

# Border
border_symbol = " "
border_style  = { fg = "#ffb786" }

# : ]]]


# : Status [[[

[status]
sep_left = { open = "", close = "🭠" }
sep_right = { open = "🭁", close = "" }

# Permissions
perm_type = { fg = "#b96b3a" }
perm_read = { fg = "#bdc03a" }
perm_write = { fg = "#838441" }
perm_exec = { fg = "#ff2b12" }
perm_sep = { fg = "#ff7e2d" }

# Progress
progress_label = { bold = true }
progress_normal = { fg = "#ffb786", bg = "#413731" }
progress_error = { fg = "#ffb4ab", bg = "#413731" }

[mode]
# Mode
normal_main = { bg = "#ffb786", fg = "#502400", bold = true }
normal_alt  = { bg = "#52443c", fg = "#d7c3b7" }

# Select mode
select_main = { bg = "#e4bfa8", fg = "#422b1b", bold = true }
select_alt  = { bg = "#52443c", fg = "#d7c3b7" }

# Unset mode
unset_main = { bg = "#c9ca94", fg = "#31320a", bold = true }
unset_alt  = { bg = "#52443c", fg = "#d7c3b7" }

# : ]]]


# : Select [[[

[select]
border = { fg = "#ffb786" }
active = { fg = "#c9ca94", bold = true }

# : ]]]


# : Input [[[

[input]
border = { fg = "#ffb786" }
value = { fg = "#f0dfd7" }

# : ]]]

# : Tabs [[[

[tabs]
active = { fg = "#ffb786", bold = true, bg = "#19120d" }
inactive = { fg = "#e4bfa8", bg = "#19120d" }
sep_inner = { open = "[", close = "]" }

# : ]]]


# : Completion [[[

[cmp]
border = { fg = "#ffb786", bg = "#502400" }

# : ]]]


# : Tasks [[[

[tasks]
border = { fg = "#ffb786" }
title = {}
hovered = { fg = "#e5e6ad", underline = true }

# : ]]]


# : Which [[[

[which]
cols = 3
mask = { bg = "#413731" }
cand = { fg = "#ffb786" }
rest = { fg = "#502400" }
desc = { fg = "#f0dfd7" }
separator = " ▶ "
separator_style = { fg = "#f0dfd7" }

# : ]]]


# : Help [[[

[help]
on = { fg = "#f0dfd7" }
run = { fg = "#f0dfd7" }
footer = { fg = "#422b1b", bg = "#e4bfa8" }

# : ]]]


# : Notify [[[

[notify]
title_info = { fg = "#c9ca94" }
title_warn = { fg = "#ffb786" }
title_error = { fg = "#ffb4ab" }

# : ]]]


# : File-specific styles [[[

[filetype]

rules = [
    # Images
    { mime = "image/*", fg = "#94e2d5" },

    # Media
    { mime = "{audio,video}/*", fg = "#f9e2af" },

    # Archives
    { mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "#f5c2e7" },

    # Documents
    { mime = "application/{pdf,doc,rtf}", fg = "#a6e3a1" },

    # Special files
    { url = "*", is = "orphan", bg = "#93000a" },
    { url = "*", is = "exec", fg = "#ffdad6" },

    # Fallback
    { url = "*", fg = "#f0dfd7" },
    { url = "*/", fg = "#ffb786" },
]

# : ]]]

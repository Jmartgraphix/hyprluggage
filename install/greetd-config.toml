[terminal]
# The VT to run the greeter on. Can be "next", "current" or a number
# designating the VT.
vt = 2

# HyprLuggage default session: greetd runs tuigreet, which starts Hyprland on login.
# The installer replaces {{USER}} with the username running ./install.sh.
#
# Session command MUST be passed to tuigreet with --cmd. Trailing bare args are
# treated as tuigreet flags and make the greeter exit immediately (crash loop).
# hyprluggage-session runs hw-ensure, then uwsm + Hyprland.

[initial_session]
# Auto-login session (runs directly on boot as {{USER}})
command = "/home/{{USER}}/.local/bin/hyprluggage-session"
user = "{{USER}}"

[default_session]
# Greeter after logout / if initial_session is unset
command = "tuigreet --time --time-format '%H:%M' --asterisks --greeting 'Welcome to Hyprluggage' --theme 'border=lightgray;prompt=white;title=white;time=lightgray;container=blue;action=cyan;button=orange' --cmd /home/{{USER}}/.local/bin/hyprluggage-session"
user = "greeter"

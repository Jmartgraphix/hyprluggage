[terminal]
vt = 2

# tuigreet --cmd must be a single executable (greetd does not run a shell).
# Keep this command line free of extra quoted args so --cmd cannot get lost.
# Theme/greeting live in install/tuigreet-config.toml → /etc/tuigreet/config.toml

[initial_session]
command = "/etc/greetd/hyprluggage-session"
user = "{{USER}}"

[default_session]
command = "tuigreet --asterisks --cmd /etc/greetd/hyprluggage-session"
user = "greeter"

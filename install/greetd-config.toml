[terminal]
# The VT to run the greeter on. Can be "next", "current" or a number
# designating the VT.
vt = 2

# HyprLuggage: greetd runs tuigreet; after login the session is hyprluggage-session
# (hw-ensure stubs, then uwsm + Hyprland).
# The installer replaces {{USER}} with the username running ./install.sh.
#
# tuigreet MUST get the session via --cmd. Bare trailing args are treated as
# tuigreet flags and the greeter exits (crash loop).
# Use /usr/local/bin so greetd does not depend on a stow symlink in $HOME.

[initial_session]
# Auto-login session (runs directly on boot as {{USER}})
command = "/usr/local/bin/hyprluggage-session"
user = "{{USER}}"

[default_session]
# Greeter after logout / if initial_session fails
command = "tuigreet --time --time-format '%H:%M' --asterisks --greeting 'Welcome to Hyprluggage' --theme 'border=lightgray;prompt=white;title=white;time=lightgray;container=blue;action=cyan;button=orange' --cmd /usr/local/bin/hyprluggage-session"
user = "greeter"

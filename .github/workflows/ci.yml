name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Run shellcheck
        run: |
          set -euo pipefail
          mapfile -t files < <(
            find install.sh boot.sh uninstall.sh install .local/bin .config/hypr/scripts \
              -type f \( \
                -name '*.sh' \
                -o -name 'hyprluggage' \
                -o -name 'hypr-vnc-mod' \
                -o -name 'hyprluggage-hw-ensure' \
                -o -name 'hyprluggage-session' \
                -o -name 'update-cursor' \
                -o -name 'toggle-waybar' \
              \) 2>/dev/null | sort -u
          )
          files+=(install/themes/hyprluggage)
          # Only bash scripts (skip binary or non-shell helpers if any)
          check=()
          for f in "${files[@]}"; do
            [[ -f "$f" ]] || continue
            if head -1 "$f" | grep -Eq '^#!.*(bash|sh)'; then
              check+=("$f")
            elif [[ "$f" == *.sh ]]; then
              check+=("$f")
            fi
          done
          echo "shellcheck ${#check[@]} files"
          shellcheck -x -s bash "${check[@]}"

  luacheck:
    name: luacheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install luacheck
        run: sudo apt-get update && sudo apt-get install -y lua-check
      - name: Run luacheck
        run: luacheck .config/hypr/*.lua

  stow:
    name: stow dry-run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install stow
        run: sudo apt-get update && sudo apt-get install -y stow
      - name: Dry-run stow into a fake HOME
        run: |
          set -euo pipefail
          CI_HOME="${RUNNER_TEMP}/hyprluggage-home"
          mkdir -p "$CI_HOME/.config" "$CI_HOME/.local/bin" "$CI_HOME/.local/share"
          stow -n -v -t "$CI_HOME" -d "$GITHUB_WORKSPACE" .

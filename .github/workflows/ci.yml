name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Run shellcheck
        run: |
          set -euo pipefail
          mapfile -t files < <(
            find install.sh boot.sh uninstall.sh install .local/bin .config/hypr/scripts \
              -type f \( \
                -name '*.sh' \
                -o -name 'hyprluggage' \
                -o -name 'hypr-vnc-mod' \
                -o -name 'hyprluggage-hw-ensure' \
                -o -name 'hyprluggage-session' \
                -o -name 'update-cursor' \
                -o -name 'toggle-waybar' \
              \) 2>/dev/null | sort -u
          )
          files+=(install/themes/hyprluggage)
          # Only bash scripts (skip binary or non-shell helpers if any)
          check=()
          for f in "${files[@]}"; do
            [[ -f "$f" ]] || continue
            if head -1 "$f" | grep -Eq '^#!.*(bash|sh)'; then
              check+=("$f")
            elif [[ "$f" == *.sh ]]; then
              check+=("$f")
            fi
          done
          echo "shellcheck ${#check[@]} files"
          shellcheck -x -s bash "${check[@]}"
      - name: Run shellcheck (user scripts, warnings and errors)
        run: |
          set -euo pipefail
          # Scripts the step above skips: whole rofi/waybar/scripts folders,
          # and extension-less scripts elsewhere. Bash/sh by shebang only
          # (skips the Python helpers). SC2155 and info/style are not enforced here.
          is_bash() { head -n1 "$1" | grep -Eq '^#!(/usr/bin/env[[:space:]]+|/usr/bin/|/bin/)(bash|sh)([[:space:]]|$)'; }
          check=()
          while IFS= read -r -d '' f; do
            if is_bash "$f"; then check+=("$f"); fi
          done < <(find .config/rofi/scripts .config/waybar/scripts scripts -type f -print0 2>/dev/null)
          while IFS= read -r -d '' f; do
            if is_bash "$f"; then check+=("$f"); fi
          done < <(find .config/hypr/scripts .local/bin install -type f ! -name '*.sh' -print0 2>/dev/null)
          mapfile -t check < <(printf '%s\n' "${check[@]}" | sort -u)
          echo "shellcheck (warning+) ${#check[@]} files"
          shellcheck -x -s bash -S warning -e SC2155 "${check[@]}"

  luacheck:
    name: luacheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install luacheck
        run: sudo apt-get update && sudo apt-get install -y lua-check
      - name: Run luacheck
        run: luacheck .config/hypr/*.lua

  stow:
    name: stow dry-run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install stow
        run: sudo apt-get update && sudo apt-get install -y stow
      - name: Dry-run stow into a fake HOME
        run: |
          set -euo pipefail
          CI_HOME="${RUNNER_TEMP}/hyprluggage-home"
          mkdir -p "$CI_HOME/.config" "$CI_HOME/.local/bin" "$CI_HOME/.local/share"
          stow -n -v -t "$CI_HOME" -d "$GITHUB_WORKSPACE" .

  themes:
    name: theme smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check theme layout and colors.toml parsing
        run: bash install/themes/smoke-themes.sh

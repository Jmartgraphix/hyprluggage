##### Display Popups #####
bind f display-popup \
  -w 80% \
  -h 80% \
  -E 'rmpc'

bind z display-popup \
  -w 80% \
  -h 80% \
  -E 'nvim ~/.config/fish/config.fish'

bind C-t display-popup \
  -d "#{pane_current_path}" \
  -w 85% \
  -h 85% \
  -E 'nvim "$(~/.config/hypr/scripts/hyprluggage-dir)/.config/nvim/lua/plugins/fzf.lua"'

  bind -r g display-popup \
  -d '#{pane_current_path}' \
  -w 85% \
  -h 85% \
  -E lazygit

##### scripts #####
bind C-e display-popup -w 40% -h 20% -E '"$(~/.config/hypr/scripts/hyprluggage-dir)/scripts/clone"'
bind h display-popup -w 15% -h 30% -E "~/.config/tmux/scripts/tmux-menu.sh"   
bind r display-popup -w 20% -h 28% -E '"$(~/.config/hypr/scripts/hyprluggage-dir)/scripts/simple_queue"'
bind k run-shell 'tmux neww "$(~/.config/hypr/scripts/hyprluggage-dir)/scripts/sessionX"'
bind C-c run-shell '"$(~/.config/hypr/scripts/hyprluggage-dir)/scripts/sessionX" ~/100xCodes/Cohort-3-WebDev/'
bind C-b run-shell '"$(~/.config/hypr/scripts/hyprluggage-dir)/scripts/sessionX" "$(~/.config/hypr/scripts/hyprluggage-dir)/.config/"'
bind C-y run-shell '"$(~/.config/hypr/scripts/hyprluggage-dir)/scripts/sessionX" ~/100xCodes/'
bind C-g run-shell '"$(~/.config/hypr/scripts/hyprluggage-dir)/scripts/open_github"'
bind j run-shell '"$(~/.config/hypr/scripts/hyprluggage-dir)/scripts/ide"'
# bind C-g run-shell '"$(~/.config/hypr/scripts/hyprluggage-dir)/scripts/clean_rmpc_cache.sh"' \; display-message "RMPC cache cleaned"  # rmpc clear cache

##### Pop-Up: Scratch Pad #####
# unbind -T popup Tab # prefix + t opens the scratchpad
# bind -n C-l display-popup -E -w 80% -h 80% ~/.config/tmux/scripts/tmux-scratch.sh
bind -T popup t send-keys t  # send 't' as a regular keystroke (prevent close)
bind -T popup q send-keys q  # send 'q' as a regular keystroke (prevent close)
bind -T popup C-t detach
bind -T popup C-[ copy-mode

##### Display Menu ##### 
bind l display-menu -T "#[align=centre]Hyprluggage" -x C -y C \
  "sessionX"      x  "display-popup -E -w 80% -h 80% 'nvim \"$(~/.config/hypr/scripts/hyprluggage-dir)/scripts/sessionX\"'" \
  "aliases.fish"  f  "display-popup -E -w 80% -h 80% 'nvim \"$(~/.config/hypr/scripts/hyprluggage-dir)/.config/fish/aliases\"'" \
  "tmux.conf"     t  "display-popup -E -w 80% -h 80% 'nvim ~/.config/tmux/tmux.conf'" \
  "bindings.lua" b  "display-popup -E -w 80% -h 80% 'nvim \"$(~/.config/hypr/scripts/hyprluggage-dir)/.config/hypr/bindings.lua\"'" \
  "keymaps.lua"   k  "display-popup -E -w 80% -h 80% 'nvim \"$(~/.config/hypr/scripts/hyprluggage-dir)/.config/nvim/lua/config/keymaps.lua\"'" \
  "Exit"          q  ""

# Learn how to configure Hyprland: https://wiki.hyprland.org/Configuring/

exec-once = hyprctl setcursor Bibata-Modern-Ice 24
# wayvnc runs via systemd user unit (wayvnc.service), not exec-once
source = ~/.config/hypr/monitors.conf
source = ~/.config/hypr/input.conf
source = ~/.config/hypr/bindings.conf
source = ~/.config/hypr/envs.conf
source = ~/.config/hypr/looknfeel.conf
source = ~/.config/hypr/autostart.conf
source = ~/.config/hypr/animations.conf
source = ~/.config/hypr/windowsrules.conf
source = ~/.config/hypr/tiling.conf
source = ~/.config/hypr/media.conf

# Form factor + GPU overlays (stubs under ~/.local/state/hyprluggage/)
# profile.conf → desktop.conf | laptop.conf | vm.conf
# gpu.conf → nvidia.conf | empty
source = ~/.local/state/hyprluggage/profile.conf
source = ~/.local/state/hyprluggage/gpu.conf

# VNC: Ctrl+Alt Super twins (hypr-vnc-mod); stub lives outside stow (see VNC.md)
source = ~/.local/state/hyprluggage/vnc-mod-active.conf

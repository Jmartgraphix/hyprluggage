# Hyprluggage laptop profile overlay
# Starts after shared autostart (which pkill's hypridle for desktop safety)

exec-once = uwsm-app -- hypridle
exec-once = ~/.config/hypr/scripts/battery-notify

input {
  touchpad {
    tap = true
  }
}

# Lighter blur than the shared look. Desktop keeps size 7 / 4 passes.
decoration {
  blur {
    size = 8
    passes = 2
  }
}

# Hybrid lid: suspend if no external monitor; clamshell (disable panel) if docked
bindl = , switch:on:Lid Switch, exec, ~/.config/hypr/scripts/lid-close
bindl = , switch:off:Lid Switch, exec, ~/.config/hypr/scripts/lid-open

# Hyprluggage NVIDIA GPU overlay (desktop or laptop)
# Applied on bare-metal NVIDIA display GPUs. The VM profile leaves this off
# by default (passthrough/compute cards are not Hyprland display devices).
# Force it with: hyprluggage-hw-ensure set vm nvidia

env = LIBVA_DRIVER_NAME,nvidia
env = __GLX_VENDOR_LIBRARY_NAME,nvidia
env = GBM_BACKEND,nvidia-drm
env = WLR_NO_HARDWARE_CURSORS,1
env = __GL_GSYNC_ALLOWED,1
env = __GL_VRR_ALLOWED,1
env = __GL_MaxFramesAllowed,1
env = __GL_SHADER_DISK_CACHE,1

cursor {
    no_hardware_cursors = 1
}
